<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoLens — AI-Powered DSA Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #7c83fd;
            letter-spacing: 2px;
        }

        header p {
            color: #888;
            margin-top: 8px;
            font-size: 1rem;
        }

        .input-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #2a2a4a;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #0f0f1a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #7c83fd;
        }

        button {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: #7c83fd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #5a63e8; }
        button:disabled { background: #444; cursor: not-allowed; }

        .result-section {
            display: none;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a4a;
        }

        .badges {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-pattern { background: #2d1b69; color: #a78bfa; }
        .badge-confidence { background: #1b3a2d; color: #6ee7b7; }
        .badge-time { background: #1b2d3a; color: #7dd3fc; }
        .badge-space { background: #3a1b2d; color: #f9a8d4; }

        .ai-section h3 {
            color: #7c83fd;
            margin-bottom: 12px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-content {
            background: #0f0f1a;
            border-radius: 8px;
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
            border-left: 3px solid #7c83fd;
        }

        .loading {
            text-align: center;
            color: #7c83fd;
            padding: 20px;
            display: none;
        }

        .error {
            background: #2d1b1b;
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ AlgoLens</h1>
            <p>Paste any DSA problem — get pattern, complexity & AI explanation instantly</p>
        </header>

        <div class="input-section">
            <textarea id="problemInput" placeholder="Paste your DSA problem here...

Example: Given an array of integers, find the longest subarray with sum equal to k."></textarea>
            <button id="analyzeBtn" onclick="analyzeProblem()">Analyze Problem</button>
        </div>

        <div class="loading" id="loading">⚡ Analyzing with AI...</div>
        <div class="error" id="error"></div>

        <div class="result-section" id="results">
            <div class="badges">
                <span class="badge badge-pattern" id="patternBadge"></span>
                <span class="badge badge-confidence" id="confidenceBadge"></span>
                <span class="badge badge-time" id="timeBadge"></span>
                <span class="badge badge-space" id="spaceBadge"></span>
            </div>
            <div class="ai-section">
                <h3>🤖 AI Explanation</h3>
                <div class="ai-content" id="aiContent"></div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeProblem() {
            const problemText = document.getElementById('problemInput').value.trim();
            if (!problemText) {
                showError("Please paste a problem first.");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.textContent = "Analyzing...";
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:8000/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem_text: problemText })
                });

                if (!response.ok) throw new Error("API error");

                const data = await response.json();

                document.getElementById('patternBadge').textContent = '🧩 ' + data.pattern;
                document.getElementById('confidenceBadge').textContent = '✅ ' + data.confidence + ' Confidence';
                document.getElementById('timeBadge').textContent = '⏱ ' + data.time_complexity;
                document.getElementById('spaceBadge').textContent = '💾 ' + data.space_complexity;
                document.getElementById('aiContent').textContent = data.ai_explanation;

                document.getElementById('results').style.display = 'block';

            } catch (err) {
                showError("Could not connect to API. Make sure the backend is running.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Analyze Problem";
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
